[package]
name = "backpack-grid-bot"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of a production-oriented Backpack futures short-only grid bot"
license = "UNLICENSED"
publish = false

[dependencies]
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
